name: WASM Browser Acceptance

on:
  pull_request:
    paths:
      - 'docs/engine/**'
      - 'docs/site.js'
      - 'docs/styles.css'
      - 'scripts/build_pages.py'
      - 'scripts/build_wasm_runtime.sh'
      - 'scripts/stage_wasm_runtime.py'
      - 'src/root_kata/exercises/**'
      - 'src/root_kata/web_server.py'
      - 'tests/test_browser_product.mjs'
      - 'wasm/**'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build static pages
        run: python scripts/build_pages.py

      - name: Install ROOT host runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtbb12

      - name: Cache ROOT WASM toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.root-kata-wasm
            ~/.cache/rootwasm-p0
          key: root-wasm-${{ runner.os }}-${{ hashFiles('wasm/**', 'scripts/build_wasm_runtime.sh') }}
          restore-keys: |
            root-wasm-${{ runner.os }}-

      - name: Build and stage browser ROOT runtime
        env:
          ROOT_HOST_TARBALL: root_v6.40.04.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
          ROOT_HOST_SHA256: 0fb35191ed9b3847abd9ab5f25878845545a5acc16a4465ca1f4310bd63191a8
        run: bash scripts/build_wasm_runtime.sh

      - name: Run real-browser acceptance
        env:
          CHROMIUM_BIN: google-chrome
        run: node tests/test_browser_product.mjs
