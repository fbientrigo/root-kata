name: WASM Browser Acceptance

on:
  pull_request:
    paths:
      - 'docs/engine/**'
      - 'docs/site.js'
      - 'docs/styles.css'
      - 'scripts/build_pages.py'
      - 'scripts/build_wasm_runtime.sh'
      - 'scripts/stage_wasm_runtime.py'
      - 'src/root_kata/exercises/**'
      - 'src/root_kata/web_server.py'
      - 'tests/test_browser_product.mjs'
      - 'wasm/**'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build static pages
        run: python scripts/build_pages.py

      - name: Cache ROOT WASM toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.root-kata-wasm
            ~/.cache/rootwasm-p0
          key: root-wasm-${{ runner.os }}-${{ hashFiles('wasm/**', 'scripts/build_wasm_runtime.sh') }}
          restore-keys: |
            root-wasm-${{ runner.os }}-

      - name: Build and stage browser ROOT runtime
        run: bash scripts/build_wasm_runtime.sh

      - name: Run real-browser acceptance
        env:
          CHROMIUM_BIN: google-chrome
        run: node tests/test_browser_product.mjs
