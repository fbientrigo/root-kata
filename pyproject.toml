[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "root-kata"
version = "0.4.0"
description = "Short, testable CERN ROOT programming challenges"
requires-python = ">=3.10"

[project.scripts]
root-kata = "root_kata.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
root_kata = ["exercises/*/*", "exercises/*/data/*", "include/*"]
